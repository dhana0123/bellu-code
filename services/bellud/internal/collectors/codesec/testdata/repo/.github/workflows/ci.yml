name: CI
on:
  push:
  pull_request_target:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: deploy
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          OTHER: ${{ secrets.API_KEY || secrets.FALLBACK }}
  call:
    uses: org/repo/.github/workflows/x.yml@main
