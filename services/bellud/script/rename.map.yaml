# Ordered rename rules applied by the sync tool to the vendored upstream Toise tree.
# Rules apply in listed order; order is part of the tool's determinism.
# Content kinds rewrite file bytes; kind "path" rewrites file paths only.
# Validation rejects any rule whose output matches any rule's input, so
# rename(rename(x)) == rename(x).
version: 1
rules:
  # --- module path (must precede the generic identifier rules)
  - kind: module
    from: github.com/toise-dev/toise
    to: github.com/bellu/bellucode/services/bellud/internal/bellugraph

  # --- proto
  - kind: proto
    from: proto/toise/v1
    to: proto/bellugraph/v1
  - kind: proto
    from: toise.v1
    to: bellugraph.v1

  # --- URI scheme
  - kind: uri
    from: "toise://"
    to: "bellugraph://"

  # --- environment variable prefix
  - kind: env
    from: TOISE_
    to: BELLU_GRAPH_

  # --- metric prefix
  - kind: metric
    from: toise_
    to: bellu_graph_

  # --- binaries (longest name first)
  - kind: binary
    from: toised
    to: bellu-graph
    exact: true
  - kind: binary
    from: toise
    to: bellu-graph
    exact: true
    scope: ["Makefile", "**/Makefile", "**/*.sh", "**/Dockerfile*", "**/*.service"]

  # --- user-facing text in Go string literals
  - kind: text
    from: '"Toise'
    to: '"Bellu Graph Engine'
    scope: ["**/*.go"]

  # --- user-facing text in non-Go files
  - kind: text
    from: Toise
    to: Bellu Graph Engine
    scope: ["**/*.md", "**/*.html", "**/*.txt", "**/*.graphql", "**/*.yaml", "**/*.yml", "**/*.json"]

  # --- Go identifiers and any remaining occurrences
  - kind: identifier
    from: Toise
    to: BelluGraph
  - kind: identifier
    from: toise
    to: bellugraph
  - kind: identifier
    from: TOISE
    to: BELLU_GRAPH

  # --- file paths
  - kind: path
    from: proto/toise/v1
    to: proto/bellugraph/v1
  - kind: path
    from: toise
    to: bellugraph
  - kind: path
    from: Toise
    to: BelluGraph
