# Reviewed license exceptions for dependencies of services/bellud (Requirement 19.4).
#
# A dependency whose license is AGPL-3.0, GPL-3.0 or SSPL fails script/check-licenses
# unless its module path is listed here. An entry counts as reviewed only when it was
