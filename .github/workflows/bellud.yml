name: bellud
on:
  push:
    branches: [dev]
    paths: &paths
      - services/bellud/**
      - packages/schema/**
      - packages/protocol/**
      - packages/client/**
      - .github/workflows/bellud.yml
      - script/check-no-upstream-name
  pull_request:
    branches: [dev, beta]
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths: *paths
  workflow_dispatch:
concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    name: go
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: services/bellud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: services/bellud/go.mod
          cache-dependency-path: services/bellud/go.sum

      - name: Require Go >= 1.26.9
        run: |
          v=$(go env GOVERSION | sed 's/^go//')
          echo "go $v"
          [ "$(printf '%s\n' 1.26.9 "$v" | sort -V | head -n1)" = "1.26.9" ]

      - name: Verify modules
        run: go mod verify

      - name: Require checksums in go.sum
        run: |
          test -s go.sum
          # every module required in go.mod must have an h1 checksum in go.sum
          go list -m -f '{{if not .Main}}{{.Path}} {{.Version}}{{end}}' all | while read -r mod ver; do
            [ -n "$mod" ] || continue
            grep -q "^$mod $ver h1:" go.sum || { echo "missing go.sum checksum: $mod $ver"; exit 1; }
          done

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short ./...


      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - uses: ./.github/actions/setup-bun

      - name: Generated files are fresh
        working-directory: .
        run: |
          bun services/bellud/script/gen-operations.ts --check
          bun services/bellud/script/gen-gocontract.ts --check
          bun services/bellud/script/gen-contract-schemas.ts --check

  cross:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: No upstream name
        working-directory: .
        run: script/check-no-upstream-name
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: services/bellud/go.mod
          cache-dependency-path: services/bellud/go.sum
      - name: Cross-compile
        working-directory: services/bellud
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out=bellud
          [ "$GOOS" = "windows" ] && out=bellud.exe
          go build -trimpath -o "$RUNNER_TEMP/$out" ./cmd/bellud

  title:
    name: title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|test)(\([a-z0-9-]+\))?: .+'; then
            echo "PR title must match: type(scope)?: description (types: feat|fix|docs|chore|refactor|test)"
            exit 1
          fi
      - name: No changeset files added
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          added=$(git diff --name-only --diff-filter=A "$BASE...$HEAD" -- '.changeset/*' || true)
          if [ -n "$added" ]; then
            echo "changeset files must not be added:"
            echo "$added"
            exit 1
          fi
