name: security-scan
# Requirement 20.16: Semgrep, Gitleaks and Trivy run over the whole repository,
# including third_party/bellu-graphify/. No path filter and no exclusion of that tree.
# Each job fails on a finding at or above its configured severity, and on any tool
# error (a non-zero exit that is not a finding also fails the job).
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SEMGREP_VERSION: "1.130.0"
  GITLEAKS_VERSION: "8.28.0"
  TRIVY_VERSION: "0.65.0"
  # Severity thresholds. A finding at or above these levels fails the build.
  SEMGREP_SEVERITY: ERROR
  TRIVY_SEVERITY: HIGH,CRITICAL
jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install "semgrep==${SEMGREP_VERSION}"
      - name: Run Semgrep
        # --error: exit 1 on findings. --severity: report only at or above threshold.
        # Scan errors (rule or parse failures) also exit non-zero by default, which fails the job.
        run: >
          semgrep scan
          --config p/default
          --severity "${SEMGREP_SEVERITY}"
          --error
          --metrics=off
          --exclude node_modules
          .

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "${base}/${archive}"
          curl -fsSL --retry 3 -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks
        # Any detected secret is a finding (Gitleaks has no severity levels), so any finding fails.
        # Exit 1 means leaks found. Other non-zero codes mean the tool failed. Both fail the job.
        # Existing allowances live in .gitleaksignore.
        run: gitleaks git --redact --exit-code 1 --no-banner --verbose .

  trivy:
    name: trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Trivy
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "${base}/${archive}"
          curl -fsSL --retry 3 -o checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Run Trivy filesystem scan
        # Dependency vulnerabilities, secrets and IaC misconfigurations over the full tree.
        # --exit-code 1 fails on any finding at or above TRIVY_SEVERITY. Tool errors exit non-zero too.
        run: >
          trivy fs
          --scanners vuln,secret,misconfig
          --severity "${TRIVY_SEVERITY}"
          --exit-code 1
          --no-progress
          .
